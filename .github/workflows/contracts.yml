name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0

      - run: forge build --sizes

      # Tests run against a Base Sepolia fork so the B20 factory, B20 tokens and PolicyRegistry precompiles are the
      # live, activated implementations.
      - run: forge test --fork-url https://sepolia.base.org -vv
